name: Canonical borrow checker (Rust V0)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Verify unit and CFG tests
        run: cargo test --all-targets
      - name: Static lint (advisory V0)
        run: cargo clippy --all-targets
