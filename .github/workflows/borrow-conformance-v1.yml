name: Borrow differential report protocol (host-only)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-protocol-selftests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "source_commit=$EXPECTED_SHA"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
          echo "GUEST_COMPILER_CONFORMANCE=NOT_VERIFIED"
      - name: Python standard-library protocol tests (not a compiler test)
        run: python3 -m unittest discover -s conformance/borrow-v1 -p 'test_*.py' -v
